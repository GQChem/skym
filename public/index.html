<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skym · project flow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗺️</text></svg>" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <div class="title">
        <span class="dot" id="live-dot" title="disconnected"></span>
        <span class="proj" id="proj-name" hidden></span>
        <h1 id="project">skym</h1>
        <select id="charts" title="Switch between chats' charts"></select>
        <span class="rev" id="rev"></span>
      </div>
      <div class="actions">
        <label class="width-ctl" title="Card width">
          <span aria-hidden="true">↔</span>
          <input id="node-width" type="range" min="200" max="520" step="4" />
        </label>
        <select id="detail-level" title="How much of each card to show">
          <option value="auto">Detail: Auto</option>
          <option value="full">Detail: Content</option>
          <option value="compact">Detail: Titles</option>
        </select>
        <button id="fit" title="Fit to screen">Fit</button>
        <button id="positive-only" title="Show successful outcomes and the paths that led to them">Positive</button>
        <button id="inline-figs" title="Show figures inline on the chart">Figures</button>
        <button id="theme" title="Toggle light/dark">Theme</button>
        <button id="export" title="Download SVG">SVG</button>
        <button id="panel-toggle" title="Toggle details panel">Details</button>
      </div>
    </header>

    <main>
      <div id="stage">
        <div id="canvas"></div>
        <div id="empty" class="empty">
          <p>No flowchart yet.</p>
          <p class="hint">Ask Claude to run <code>flow_init</code> to start one.</p>
        </div>
      </div>

      <aside id="panel">
        <section>
          <h2>Selected</h2>
          <div id="detail" class="muted">Click a node in the chart.</div>
        </section>
        <section>
          <h2>Legend</h2>
          <div id="legend" class="legend"></div>
        </section>
        <section>
          <h2>Activity</h2>
          <ol id="events" class="events"></ol>
        </section>
        <section id="commands-section" hidden>
          <h2>Requests</h2>
          <ol id="commands-list" class="events"></ol>
        </section>
      </aside>
    </main>

    <div id="node-menu" class="node-menu" hidden></div>

    <dialog id="request-dialog" class="request-dialog">
      <form method="dialog" id="request-form">
        <h2>Request agent work</h2>
        <p id="request-context" class="muted"></p>
        <label for="request-body">What should the agent do?</label>
        <textarea id="request-body" maxlength="4000" rows="6" required autofocus></textarea>
        <div class="dialog-actions">
          <button value="cancel" type="button" id="request-cancel">Cancel</button>
          <button value="submit" type="submit" class="active">Queue request</button>
        </div>
      </form>
    </dialog>

    <div id="lightbox" class="lightbox" hidden>
      <img id="lightbox-img" alt="" />
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
