name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skym
          POSTGRES_PASSWORD: skym
          POSTGRES_DB: skym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skym -d skym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://skym:skym@127.0.0.1:5432/skym_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SKYM_HOME: ${{ runner.temp }}/skym-home
      - run: npm test --workspace service
        env:
          SKYM_HOME: ${{ runner.temp }}/skym-home
      - run: npm pack --dry-run

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SKYM_HOME: ${{ runner.temp }}\skym-home
