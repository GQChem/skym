<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — skym</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗺️</text></svg>" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap" id="main"></main>

    <footer class="foot" id="foot"></footer>

    <script type="module">
      import { $, bytes, escapeHtml, me, renderFooter, renderNav, renderSignin } from "/site.js";

      renderFooter();
      const session = await me();
      const user = session?.user ?? null;
      renderNav(user, "/settings");

      const main = $("main");

      if (!user) {
        main.innerHTML =
          `<div class="panel signin-card">` +
          `<h2>Sign in to skym</h2>` +
          `<p class="sub">Settings live with your account.</p>` +
          `<div id="signin"></div>` +
          `</div>`;
        await renderSignin($("signin"));
      } else {
        main.innerHTML =
          `<div class="page-head"><div><h1>Settings</h1><p>Your account and connected agents.</p></div></div>` +
          `<div class="panel">` +
          `<h2>Connect an agent</h2>` +
          `<p class="sub">Run your agent with the skym-flow MCP server. The first chart tool prints a code — enter it here to link that machine to this account.</p>` +
          `<div class="field-row">` +
          `<input id="code" type="text" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="9" />` +
          `<button class="btn primary" id="approve">Approve</button>` +
          `</div>` +
          `<p class="msg" id="msg"></p>` +
          `</div>` +
          `<div class="panel">` +
          `<h2>Connected agents</h2>` +
          `<p class="sub">Revoke machines you no longer use. A revoked agent must pair again before it can sync.</p>` +
          `<div id="agents" class="muted">Checkingâ€¦</div>` +
          `</div>` +
          `<div class="panel">` +
          `<h2>Storage</h2>` +
          `<p class="sub">Figures your agents have uploaded.</p>` +
          `<div id="usage" class="muted">Checking…</div>` +
          `</div>` +
          `<div class="panel">` +
          `<h2>Billing</h2>` +
          `<p class="sub">The product stays fully featured; paid plans only increase hosted artifact storage.</p>` +
          `<div id="billing" class="muted">Checking...</div>` +
          `</div>` +
          `<div class="panel">` +
          `<h2>Account</h2>` +
          `<dl class="kv">` +
          `<dt>Email</dt><dd>${escapeHtml(user.email)}</dd>` +
          (user.name ? `<dt>Name</dt><dd>${escapeHtml(user.name)}</dd>` : "") +
          `</dl>` +
          `<div class="field-row">` +
          `<a class="btn" href="/api/account/export">Download my data</a>` +
          `<form method="POST" action="/auth/logout"><button class="btn" type="submit">Log out</button></form>` +
          `</div>` +
          `</div>` +
          `<div class="panel">` +
          `<h2>Delete account</h2>` +
          `<p class="sub">Permanently delete your account, owned projects, charts, operations, figures, and connected-agent credentials. Download your data first if you need a copy.</p>` +
          `<button class="btn danger" id="delete-account" type="button">Delete account</button>` +
          `<p class="msg" id="delete-msg"></p>` +
          `</div>`;

        renderUsage();
        renderAgents();
        renderBilling();

        async function renderBilling() {
          const b = await fetch("/api/billing").then((r) => (r.ok ? r.json() : null)).catch(() => null);
          const el = $("billing");
          if (!b?.configured) {
            el.textContent = "Paid storage is not available on this deployment yet.";
            return;
          }
          const pro = b.plan === "pro";
          el.innerHTML = `<p class="msg">Plan: <span class="pill">${escapeHtml(b.plan || "free")}</span>` +
            (b.subscription_status ? ` · ${escapeHtml(b.subscription_status)}` : "") + `</p>` +
            (pro && !b.has_customer
              ? `<p class="muted">Pro access was granted directly. There is no Stripe subscription to manage.</p>`
              : `<button class="btn ${b.has_customer ? "" : "primary"}" id="billing-action" type="button">${b.has_customer ? "Manage billing" : "Upgrade storage"}</button>` +
                `<p class="msg" id="billing-msg"></p>`);
          if (pro && !b.has_customer) return;
          $("billing-action").addEventListener("click", async () => {
            const action = b.has_customer ? "portal" : "checkout";
            const button = $("billing-action");
            const message = $("billing-msg");
            button.disabled = true;
            message.textContent = "Opening Stripe...";
            const out = await fetch(`/api/billing/${action}`, { method: "POST" })
              .then(async (r) => ({ ok: r.ok, ...(await r.json().catch(() => ({}))) }))
              .catch(() => ({ ok: false, error: "Could not reach the billing service." }));
            if (out?.url) location.href = out.url;
            else {
              message.textContent = out?.error || "Stripe could not open the billing page. Please try again.";
              button.disabled = false;
            }
          });
        }

        async function renderAgents() {
          const out = await fetch("/api/agents")
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
          const el = $("agents");
          if (!out) {
            el.textContent = "Connected agents are unavailable right now.";
            return;
          }
          if (!out.agents?.length) {
            el.textContent = "No agents connected.";
            return;
          }
          el.innerHTML = out.agents.map((agent) =>
            `<div class="field-row" data-agent="${escapeHtml(agent.id)}">` +
            `<div><strong>${escapeHtml(agent.label || "skym-flow agent")}</strong>` +
            `<p class="msg">${agent.lastUsedAt ? `Last used ${escapeHtml(new Date(agent.lastUsedAt).toLocaleString())}` : "Not used yet"}</p></div>` +
            `<span class="spacer"></span>` +
            `<button class="btn danger" type="button" data-revoke="${escapeHtml(agent.id)}">Revoke</button>` +
            `</div>`
          ).join("");
          for (const button of el.querySelectorAll("[data-revoke]")) {
            button.addEventListener("click", async () => {
              if (!confirm("Revoke this agent? It will stop syncing immediately.")) return;
              button.disabled = true;
              const r = await fetch(`/api/agents/${encodeURIComponent(button.dataset.revoke)}`, { method: "DELETE" }).catch(() => null);
              if (r?.ok) renderAgents();
              else button.disabled = false;
            });
          }
        }

        async function renderUsage() {
          const u = await fetch("/api/usage")
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
          const el = $("usage");
          if (!u) {
            el.textContent = "Usage is unavailable right now.";
            return;
          }
          const pct = u.quota > 0 ? Math.min(100, (u.used / u.quota) * 100) : 0;
          el.innerHTML =
            `<div class="meter${pct >= 90 ? " full" : ""}"><span style="width:${pct.toFixed(1)}%"></span></div>` +
            `<p class="msg">${escapeHtml(bytes(u.used))} of ${escapeHtml(bytes(u.quota))} used` +
            `<span class="pill" style="margin-left:8px">${escapeHtml(u.plan ?? "free")}</span>` +
            (pct >= 90 ? "<br />Uploads are refused once this is full — nothing already stored is deleted." : "") +
            `</p>`;
        }

        const approve = async () => {
          const user_code = $("code").value.trim();
          const msg = $("msg");
          if (!user_code) {
            msg.className = "msg bad";
            msg.textContent = "Enter the code your agent printed.";
            return;
          }
          const r = await fetch("/api/pair/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_code }),
          }).catch(() => null);
          msg.className = r?.ok ? "msg good" : "msg bad";
          msg.textContent = r?.ok
            ? "Agent connected. Back to your terminal — charts will sync here."
            : "Unknown or expired code. Ask the agent for a fresh one.";
          if (r?.ok) $("code").value = "";
        };

        $("approve").addEventListener("click", approve);
        $("code").addEventListener("keydown", (e) => {
          if (e.key === "Enter") approve();
        });

        $("delete-account").addEventListener("click", async () => {
          const confirmation = prompt('Type DELETE to permanently delete your skym account.');
          if (confirmation !== "DELETE") return;
          const button = $("delete-account");
          const msg = $("delete-msg");
          button.disabled = true;
          const r = await fetch("/api/account", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ confirmation }),
          }).catch(() => null);
          if (r?.ok) location.href = "/";
          else {
            button.disabled = false;
            msg.className = "msg bad";
            msg.textContent = "Could not delete the account. Nothing else was requested; try again.";
          }
        });
      }
    </script>
  </body>
</html>
