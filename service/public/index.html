<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skym</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗺️</text></svg>" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6fa; --card: #fff; --ink: #141a24; --muted: #6b7789;
        --line: #dde3ec; --accent: #2a78d6;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #161b26; --card: #1c2230; --ink: #f2f5fa; --muted: #8b97ab; --line: #2c3444; --accent: #5aa3e8; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--bg); color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(92vw, 30rem); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
      h1 { margin: 0 0 4px; font-size: 1.35rem; }
      p.sub { margin: 0 0 22px; color: var(--muted); }
      a.btn, button.btn {
        display: flex; align-items: center; justify-content: center; gap: 9px;
        width: 100%; padding: 11px 14px; margin-bottom: 10px;
        border: 1px solid var(--line); border-radius: 9px; background: transparent;
        color: inherit; font: inherit; text-decoration: none; cursor: pointer;
      }
      a.btn:hover, button.btn:hover { border-color: var(--accent); }
      .code {
        font: 600 1.5rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: .12em; text-align: center; padding: 14px;
        border: 1px dashed var(--line); border-radius: 9px; margin: 6px 0 18px;
      }
      input {
        width: 100%; padding: 11px 12px; margin-bottom: 10px;
        border: 1px solid var(--line); border-radius: 9px;
        background: transparent; color: inherit; font: inherit;
        text-transform: uppercase; letter-spacing: .1em;
      }
      .msg { margin-top: 12px; color: var(--muted); font-size: .92rem; }
      .msg.bad { color: #d03b3b; }
      .msg.good { color: #0d8a63; }
      ul { margin: 0; padding-left: 18px; color: var(--muted); }
      li { margin: 3px 0; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>skym</h1>
        <p class="sub" id="sub">Sign in to see your charts.</p>
        <div id="signin"></div>
        <div id="account" hidden>
          <hr />
          <h1 style="font-size:1rem">Connect an agent</h1>
          <p class="sub">Run <code>skym-flow</code> locally, then enter the code it prints.</p>
          <input id="code" placeholder="XXXX-XXXX" autocomplete="off" spellcheck="false" />
          <button class="btn" id="approve">Approve</button>
          <p class="msg" id="msg"></p>
        </div>
      </div>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const label = { google: "Continue with Google", github: "Continue with GitHub" };

      const me = await fetch("/api/me").then((r) => (r.ok ? r.json() : null)).catch(() => null);

      if (me?.user) {
        $("sub").textContent = `Signed in as ${me.user.email}`;
        $("account").hidden = false;
        const charts = await fetch("/api/charts").then((r) => r.json()).catch(() => ({ charts: [] }));
        if (charts.charts?.length) {
          const list = document.createElement("ul");
          for (const c of charts.charts.slice(0, 20)) {
            const li = document.createElement("li");
            li.textContent = `${c.title} — rev ${c.revision}`;
            list.appendChild(li);
          }
          $("signin").appendChild(list);
        } else {
          $("signin").innerHTML = `<p class="msg">No charts yet. Pair an agent below, then run flow_init.</p>`;
        }
      } else {
        const { providers = [] } = await fetch("/api/providers").then((r) => r.json()).catch(() => ({}));
        if (!providers.length) {
          $("signin").innerHTML = `<p class="msg bad">No sign-in provider is configured on this deploy.</p>`;
        }
        for (const p of providers) {
          const a = document.createElement("a");
          a.className = "btn";
          a.href = `/auth/${p}`;
          a.textContent = label[p] ?? p;
          $("signin").appendChild(a);
        }
      }

      $("approve")?.addEventListener("click", async () => {
        const user_code = $("code").value.trim();
        if (!user_code) return;
        const r = await fetch("/api/pair/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_code }),
        });
        const msg = $("msg");
        msg.className = r.ok ? "msg good" : "msg bad";
        msg.textContent = r.ok ? "Agent connected. Back to your terminal." : "Unknown or expired code.";
      });
    </script>
  </body>
</html>
