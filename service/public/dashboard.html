<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Charts — skym</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🗺️</text></svg>" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="nav" id="nav"></header>

    <main class="wrap" id="main">
      <div class="grid" id="loading">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
    </main>

    <footer class="foot" id="foot"></footer>

    <script type="module">
      import { $, ago, escapeHtml, me, renderFooter, renderNav, renderSignin } from "/site.js";

      renderFooter();
      const session = await me();
      const user = session?.user ?? null;
      renderNav(user, "/dashboard");

      const main = $("main");

      if (!user) {
        main.innerHTML =
          `<div class="panel signin-card">` +
          `<h2>Sign in to skym</h2>` +
          `<p class="sub">Your charts follow your account.</p>` +
          `<div id="signin"></div>` +
          `</div>`;
        await renderSignin($("signin"));
      } else {
        const charts = [];
        let cursor = null;
        do {
          const page = await fetch(`/api/charts?limit=100${cursor ? `&cursor=${encodeURIComponent(cursor)}` : ""}`)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
          if (!page) break;
          charts.push(...(page.charts ?? []));
          cursor = page.next_cursor ?? null;
        } while (cursor);

        const head =
          `<div class="page-head">` +
          `<div><h1>My Charts</h1><p>${charts.length} chart${charts.length === 1 ? "" : "s"} synced to this account.</p></div>` +
          `<span class="spacer"></span>` +
          `<a class="btn" href="/settings">Connect an agent</a>` +
          `</div>`;

        // A chart with no ops has nothing to draw; say so rather than let the
        // card promise a picture the viewer cannot render.
        const card = (c) => {
          const title = c.title || c.slug;
          const empty = Number(c.ops ?? 0) === 0;
          return (
            `<div class="chart-card${empty ? " is-empty" : ""}">` +
            `<a class="chart-open" href="/chart?chart=${encodeURIComponent(c.id)}">` +
            `<h3>${escapeHtml(title)}</h3>` +
            `<span class="project">${escapeHtml(c.project ?? "")}</span>` +
            `<div class="chart-meta">` +
            `<span class="pill">${empty ? "empty" : `rev ${escapeHtml(c.revision)}`}</span>` +
            `<span class="when">${escapeHtml(ago(c.updated_at))}</span>` +
            `</div></a>` +
            `<button class="card-del" type="button" title="Delete chart"` +
            ` data-id="${escapeHtml(c.id)}" data-title="${escapeHtml(title)}"` +
            ` aria-label="Delete ${escapeHtml(title)}">×</button>` +
            `</div>`
          );
        };

        const body = charts.length
          ? `<div class="grid">${charts.map(card).join("")}</div>`
          : `<div class="empty">` +
            `<h3>No charts yet</h3>` +
            `<p>Connect an agent in Settings, then ask it to start a chart with <code>flow_init</code>. It will appear here as it works.</p>` +
            `</div>`;

        main.innerHTML = head + body;
        wireDelete();
      }

      function wireDelete() {
        for (const btn of document.querySelectorAll(".card-del")) {
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            confirmDelete(btn.dataset.id, btn.dataset.title);
          });
        }
      }

      /** Mid-page confirm. Deleting a chart drops its ops and figures for good. */
      function confirmDelete(id, title) {
        const host = document.createElement("div");
        host.className = "modal-back";
        host.innerHTML =
          `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="del-q">` +
          `<h2 id="del-q">Delete chart?</h2>` +
          `<p>“<strong>${escapeHtml(title)}</strong>” and everything on it — every node, and every figure — will be removed. This cannot be undone.</p>` +
          `<div class="modal-actions">` +
          `<button class="btn" data-act="no">No, keep it</button>` +
          `<button class="btn danger" data-act="yes">Yes, delete</button>` +
          `</div><p class="msg" id="del-msg"></p></div>`;
        document.body.appendChild(host);

        const close = () => host.remove();
        host.addEventListener("click", (e) => {
          if (e.target === host) close();
        });
        document.addEventListener("keydown", function esc(e) {
          if (e.key === "Escape") {
            close();
            document.removeEventListener("keydown", esc);
          }
        });
        host.querySelector('[data-act="no"]').addEventListener("click", close);
        host.querySelector('[data-act="yes"]').addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          btn.disabled = true;
          const r = await fetch(`/api/charts/${encodeURIComponent(id)}`, { method: "DELETE" }).catch(() => null);
          if (r?.ok) {
            location.reload();
          } else {
            btn.disabled = false;
            const msg = host.querySelector("#del-msg");
            msg.className = "msg bad";
            msg.textContent = "Could not delete that chart. Try again.";
          }
        });
        host.querySelector('[data-act="no"]').focus();
      }
    </script>
  </body>
</html>
